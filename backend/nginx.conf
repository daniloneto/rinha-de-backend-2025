worker_processes auto;
worker_rlimit_nofile 500000;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 3;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;      
    #limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;
    
    # Backend upstream configuration
    upstream backend {
        least_conn;
        server backend-1:8080 max_fails=3 fail_timeout=30s;
        server backend-2:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main server configuration
    server {
        listen 80;
        server_name _;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        
        # Remove server header
        server_tokens off;
        # Rate limiting - increased burst for high load
        #limit_req zone=api burst=100 nodelay;
        
        # Client settings
        client_max_body_size 1k;
        client_body_timeout 10s;
        client_header_timeout 10s;
          # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;  # Aumentar de 5s para 10s
        proxy_send_timeout 30s;     # Aumentar de 10s para 30s
        proxy_read_timeout 30s;     # Aumentar de 10s para 30s
        proxy_buffering off;
        
        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Keep-Alive "";
            proxy_set_header Proxy-Connection "keep-alive";
        }
        
        # Payment endpoints
        location /payments {
            proxy_pass http://backend;
            proxy_set_header Keep-Alive "";
            proxy_set_header Proxy-Connection "keep-alive";
        }
        
        # Payment summary endpoint
        location /payments-summary {
            proxy_pass http://backend;
            proxy_set_header Keep-Alive "";
            proxy_set_header Proxy-Connection "keep-alive";
        }
        
        # Default location - return 404
        location / {
            return 404;
        }
    }
}
